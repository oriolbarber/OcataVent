<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plànol de la base · Ocata Vent</title>
<link rel="icon" href="icons/logo.svg?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef5;--surface:#fff;--surface-2:#f3f6fa;--line:#cbd5e2;--ink:#0a1322;--muted:#4a5a72;
  --accent:#0068b8;--on-accent:#fff;--ideal:#007a45;--marg:#d05a00;--no:#c3162a;--sel:#0a84ff;
  --f-body:"Barlow",system-ui,sans-serif;--f-head:"Rajdhani","Barlow",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060c19;--surface:#0d1729;--surface-2:#122039;--line:#1f3050;--ink:#e9f1ff;--muted:#8fa4c6;--accent:#3cd0ff;--on-accent:#03121c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body)}
body{display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 300px;grid-template-areas:"top top" "map side";height:100dvh;overflow:hidden}
header{grid-area:top;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{margin:0 8px 0 0;font:700 1.2rem var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.grp{display:flex;gap:4px;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
button,select,input{font:inherit;color:inherit}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.tb svg{width:20px;height:20px;flex:none}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tb:disabled{opacity:.4;cursor:default}
#map{grid-area:map;position:relative;overflow:hidden;background:#cfd6df;touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:default}
#svg.pan{cursor:grab}#svg.panning{cursor:grabbing}#svg.draw{cursor:crosshair}
aside{grid-area:side;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
aside h2{margin:0;font:700 1.05rem var(--f-head);letter-spacing:.06em;text-transform:uppercase}
.lbl{font:700 .72rem var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:3px}
.f input,.f select{min-height:38px;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.f input,.f select{width:100%;min-width:0}
.note{font-size:.84rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slide{position:relative;height:46px;border-radius:999px;background:color-mix(in srgb,var(--no) 18%,var(--surface-2));border:1.5px solid var(--no);overflow:hidden}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--no);pointer-events:none;font-size:.9rem}
.slide input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.slide i{position:absolute;top:3px;left:3px;width:38px;height:38px;border-radius:50%;background:var(--no);pointer-events:none}
.hud{position:absolute;left:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;pointer-events:none}
.scale{background:#fffd;color:#0a1322;border-radius:8px;padding:4px 8px;font:600 .8rem var(--f-mono)}
.scale b{display:block;height:6px;border:2px solid #0a1322;border-top:0;margin-top:3px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom .tb{width:44px;justify-content:center;padding:0;background:var(--surface)}
.tip{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0a1322e6;color:#fff;padding:6px 12px;border-radius:10px;font-size:.88rem;pointer-events:none;max-width:90%;text-align:center}
.tip:empty{display:none}
.bgbar{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;padding:6px;border-radius:14px;background:#0a1322e0;color:#fff;z-index:2}
.bgbar[hidden]{display:none}
.bgbar .tb{min-height:42px;min-width:44px;padding:0 8px;justify-content:center;background:#ffcf33;border-color:#ffcf33;color:#0a1322;font:700 .95rem var(--f-mono)}
.bgbar b{min-width:58px;text-align:center;font:700 1rem var(--f-mono)}
.bgbar .sep{width:6px}
#map.bgmode .tip{top:auto;bottom:56px}
.attr{position:absolute;right:62px;bottom:6px;font-size:.7rem;background:#fffc;color:#0a1322;padding:1px 6px;border-radius:6px}
details summary{cursor:pointer;font-weight:600}
body.embed header h1,body.embed header > a{display:none}
#cloudSt.err{color:var(--no);font-weight:700}
a.tb{text-decoration:none;color:inherit}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"top" "map" "side"}
  aside{max-height:42dvh;border-left:0;border-top:1px solid var(--line)}
  .tb span{display:none}
}
</style>
</head>
<body>
<script>if(new URLSearchParams(location.search).get("embed") === "1") document.body.classList.add("embed");</script>
<header>
  <a href="./" title="Torna a l'app" style="display:flex"><img src="icons/logo.svg?v=3" alt="" width="32" height="32"></a>
  <h1>Plànol de la base</h1><span id="cloudSt" class="note" style="margin-right:8px"></span>
  <div class="grp" role="toolbar" aria-label="Eines">
    <button class="tb" data-tool="sel" title="Selecciona i mou (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg><span>Selecciona</span></button>
    <button class="tb" data-tool="place" title="Plaça (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><rect x="3" y="7" width="18" height="10" rx="1"/></svg><span>Plaça</span></button>
    <button class="tb" data-tool="poly" title="Edifici, zona o mar (Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 18l2-12 9-2 5 9-6 7z"/></svg><span>Zona</span></button>
    <button class="tb" data-tool="point" title="Punt de servei (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span>Punt</span></button>
    <button class="tb" data-tool="measure" title="Mesura (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>Mesura</span></button>
    <button class="tb" data-tool="app" title="Vista de l'app: el que veuen els socis (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span>Vista app</span></button>
    <button class="tb" data-tool="costa" title="Orientació del mar: d'on bufa el terral (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9h18"/><path d="M3 14c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0M3 19c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0"/><path d="M12 9V3M9.5 5.5 12 3l2.5 2.5"/></svg><span>Mar</span></button>
    <button class="tb" data-tool="bg" title="Ajusta la foto de fons (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg><span>Fons</span></button>
  </div>
  <div class="grp">
    <button class="tb" id="undo" title="Desfés (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Desfés</span></button>
    <button class="tb" id="redo" title="Refés (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span>Refés</span></button>
  </div>
  <div class="grp">
    <button class="tb" id="exp" title="Exporta el plànol (JSON)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span>Exporta</span></button>
    <button class="tb" id="imp" title="Importa un plànol (JSON)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg><span>Importa</span></button>
    <input type="file" id="impF" accept="application/json,.json" hidden>
  </div>
</header>

<div id="map">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Plànol editable">
    <defs>
      <pattern id="ovHatch" width="1" height="1" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v1" stroke="#c3162a" stroke-width=".25"/></pattern>
    </defs>
    <g id="gBg"></g><g id="gPoly"></g><g id="gPlace"></g><g id="gBoat"></g><g id="gPoint"></g><g id="gUi"></g>
  </svg>
  <div class="bgbar" id="bgbar" hidden role="toolbar" aria-label="Gira i escala la foto">
    <button class="tb" data-bgrot="-5" aria-label="Gira 5° a l'esquerra">↺5°</button><button class="tb" data-bgrot="-1" aria-label="Gira 1° a l'esquerra">↺1°</button><button class="tb" data-bgrot="-0.1" aria-label="Gira 0,1° a l'esquerra">↺.1</button>
    <b id="bgdeg">0°</b>
    <button class="tb" data-bgrot="0.1" aria-label="Gira 0,1° a la dreta">↻.1</button><button class="tb" data-bgrot="1" aria-label="Gira 1° a la dreta">↻1°</button><button class="tb" data-bgrot="5" aria-label="Gira 5° a la dreta">↻5°</button>
    <span class="sep"></span><button class="tb" data-bgsc="0.98" aria-label="Fes la foto més petita">−</button><button class="tb" data-bgsc="1.02" aria-label="Fes la foto més gran">+</button>
  </div>
  <div class="tip" id="tip"></div>
  <div class="hud"><div class="scale" id="scale"></div></div>
  <div class="attr" id="attr"></div>
  <div class="zoom"><button class="tb" id="zin" aria-label="Apropa">+</button><button class="tb" id="zout" aria-label="Allunya">−</button><button class="tb" id="zfit" aria-label="Encaixa-ho tot" title="Encaixa-ho tot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
</div>

<aside id="side" aria-live="polite"></aside>

<script src="clubs.js?v=1"></script>
<script src="boats.js?v=1"></script>
<script src="planol-core.js?v=6"></script>
<script src="planol-cloud.js?v=5"></script>
<script src="planol.js?v=12"></script>
</body>
</html>
