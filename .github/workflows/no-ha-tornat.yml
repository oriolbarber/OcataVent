# Avís «no ha tornat a l'hora»: cada 10 minuts mira qui és a l'aigua i ha passat la tornada prevista.
# GitHub pot endarrerir les execucions programades uns minuts (de vegades més d'un quart d'hora).
name: No ha tornat a l'hora
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: no-ha-tornat
  cancel-in-progress: false
jobs:
  vigila:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instal·la firebase-admin
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Revisa la presència
        env:
          TZ: Europe/Madrid
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          MARGE_MIN: ${{ vars.MARGE_MIN }}
        run: node scripts/no-ha-tornat.mjs
