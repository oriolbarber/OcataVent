# Historial d'encerts dels models: desa la previsió al matí i la compara amb l'estació al vespre.
# Dues hores per franja (UTC) perquè sempre n'hi hagi una dins l'horari d'estiu i una dins l'horari d'hivern;
# l'script sap si ja ho ha fet avui i no ho repeteix.
name: Encerts dels models
on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
    - cron: "10 20 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, previsio o compara"
        default: auto
permissions:
  contents: write
concurrency:
  group: encerts
  cancel-in-progress: false
jobs:
  encerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Previsió o comparació
        env:
          TZ: Europe/Madrid
        run: node scripts/encerts.mjs "${{ github.event.inputs.mode || 'auto' }}"
      - name: Desa els resultats al repositori
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Encerts dels models: $(TZ=Europe/Madrid date +%F\ %H:%M)"
            git pull --rebase --autostash
            git push
          else
            echo "Sense canvis."
          fi
