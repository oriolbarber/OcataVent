# Publica les Cloud Functions (memòria cau meteo: functions/) cada cop que canvien, o a mà des de la pestanya Actions.
# Requisits (una sola vegada, a la consola):
#  1. Projecte Firebase al pla Blaze, amb alerta de pressupost.
#  2. Al compte de servei del secret FIREBASE_SERVICE_ACCOUNT, a Google Cloud ▸ IAM, els rols «Editor» i «Service Account User».
# Sense això, l'acció falla i l'app continua funcionant igual (llegeix les fonts directament).
name: Publica les Cloud Functions

on:
  push:
    branches: [main]
    paths: [functions/**]
  workflow_dispatch:

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Comprova el secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta el secret FIREBASE_SERVICE_ACCOUNT: les funcions NO s'han publicat."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instal·la les dependències
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Publica les funcions
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          # --force: accepta la neteja automàtica de les imatges velles (Artifact Registry), perquè no s'acumulin ni costin
          npx -y firebase-tools@latest deploy --only functions --project ocatavent --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/out.txt"
          rc=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$rc" -ne 0 ]; then
            grep -iE "error|denied|permission|blaze|billing|403|enable" "$RUNNER_TEMP/out.txt" | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$rc"
          fi
